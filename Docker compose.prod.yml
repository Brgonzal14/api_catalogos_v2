services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: catalogos
      POSTGRES_PASSWORD: catalogos
      POSTGRES_DB: catalogos_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogos -d catalogos_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  db_ready:
    image: postgres:16
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: catalogos
      POSTGRES_PASSWORD: catalogos
      POSTGRES_DB: catalogos_db
      PGPASSWORD: catalogos
      PGHOST: db
      PGPORT: 5432
    volumes:
      - ./db/ensure_indexes.sh:/ensure_indexes.sh:ro
    entrypoint: ["bash", "/ensure_indexes.sh"]
    restart: "no"

  api:
    image: catalogos-api:latest      # usa imagen pre-construida, NO reconstruye
    depends_on:
      - db
      - db_ready
    environment:
      DATABASE_URL: postgresql://catalogos:catalogos@db:5432/catalogos_db
    ports:
      - "8000:8000"
    # SIN volumes de código: el app queda sellado dentro de la imagen
    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers 2
      --timeout 120
      --access-logfile -
      --error-logfile -
      --log-level info

volumes:
  db_data: